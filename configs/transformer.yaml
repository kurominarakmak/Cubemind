name: transformer_state_history
data:
  train: data/processed/train.jsonl
  validation: data/processed/validation.jsonl
model:
  type: transformer
  use_history: true
  max_history: 8
  embedding_dim: 64
  attention_heads: 4
  layers: 2
  feedforward_dim: 128
  dropout: 0.1
train:
  seed: 17
  device: auto
  cpu_threads: 2
  epochs: 24
  batch_size: 64
  learning_rate: 0.0007
  weight_decay: 0.0001
  gradient_clip: 1.0
  early_stopping_patience: 5
  checkpoint: artifacts/transformer-state-history.pt
  metrics: artifacts/transformer-state-history.jsonl
