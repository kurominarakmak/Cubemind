[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cubemind"
version = "0.1.0"
description = "Learning human speedcubing decisions from solve demonstrations"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
demo = ["streamlit>=1.33,<2"]

[tool.setuptools.packages.find]
include = ["cubemind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
